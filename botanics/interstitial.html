<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Moon Botanics</title>
    
    <link rel="preconnect" href="https://blue-moon-botanics-production.up.railway.app">
    <link rel="dns-prefetch" href="https://blue-moon-botanics-production.up.railway.app">

    <style>
        body { 
            background: #ffffff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #2d3748;
        }
        .loader-container {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
            max-width: 80%;
        }
        .loading-text {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }
        /* Styling for the new quip section */
        .quip-text {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #718096;
            font-style: italic;
            animation: fadeIn 1.5s ease-in;
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="loader-container">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#2d3748" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <div class="loading-text">Loading your plant library...</div>
        <div class="quip-text" id="quip-display"></div>
    </div>

    <script>
        // Array of quips to cycle through
        const plantQuips = [
            "Just a moment, photosynthesizing...",
            "Fact: Talking to your plants helps them grow. (We won't judge.)",
            "Fetching sunlight and soil specs...",
            "Remember: Overwatering is the #1 cause of plant heartbreak.",
            "Translating root signals into readable data..."
        ];

        // Pick a random quip and inject it into the HTML
        const randomQuip = plantQuips[Math.floor(Math.random() * plantQuips.length)];
        document.getElementById("quip-display").innerText = randomQuip;

        // Extended 3.5 second delay before handoff
        setTimeout(() => {
            window.location.href = "https://blue-moon-botanics-production.up.railway.app/";
        }, 3500); 
    </script>
</body>
</html>
